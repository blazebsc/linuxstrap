app-id: org.linuxstrap.dev
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: linuxstrap

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=host:ro
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: linuxstrap
    buildsystem: simple
    build-commands:
      - install -Dm755 linuxstrap /app/bin/linuxstrap
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/org.linuxstrap.dev.png
      - install -Dm644 128x128@2x.png /app/share/icons/hicolor/256x256/apps/org.linuxstrap.dev.png
      - install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/org.linuxstrap.dev.png
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/org.linuxstrap.dev.png
    sources:
      - type: file
        path: ../src-tauri/target/release/linuxstrap
      - type: file
        path: ../src-tauri/icons/128x128.png
      - type: file
        path: ../src-tauri/icons/128x128@2x.png
      - type: file
        path: ../src-tauri/icons/32x32.png
      - type: file
        path: ../src-tauri/icons/icon.png